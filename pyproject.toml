[project]
name = "k-matrix-day-2025"
version = "0.0.0"
requires-python = "~=3.13.0"
license-files = ["LICENSE"]
authors = [
    { name = "Ilya Segal" },
    { name = "Lena Pöpping" },
    { name = "Mikhail Mikhasenko" },
    { name = "Nils Hüsken" },
    { name = "Remco de Boer" },
]
dependencies = [
    "ampform",
    "iminuit",
    "matplotlib",
    "sympy",
]

[dependency-groups]
dev = [
    "ruff",
    { include-group = "doc" },
    { include-group = "jupyter" },
]
doc = [
    "jupyter-cache",
    "quarto-cli",
]
jupyter = [
    "jupyter-ruff",
    "jupyterlab",
    "jupyterlab-git",
    "jupyterlab-lsp",
    "jupyterlab-quarto",
    "jupyterlab-quickopen",
    "python-lsp-ruff",
    "python-lsp-server",
]
lite = [
    "jupyter-ruff",
    "jupyterlab",
    "jupyterlab-lsp",
    "jupyterlab-quarto",
    "jupyterlite-core",
    "jupyterlite-pyodide-kernel",
    "notebook",
    "python-lsp-server",
]

[tool.compwa.policy]
package-manager = "pixi"

[tool.compwa.policy.nb]
no-binder = true

[tool.compwa.policy.github]
no-cd = true
no-github-actions = true

[tool.compwa.policy.format]
no-cspell-update = true

[tool.lychee]
exclude = [
    "^https://amplitude-analysis\\.slack\\.com/",  # requires a Slack account
    "^https://github\\.com/signup",  # blocks automated requests
    "^https://indico\\.ph\\.tum\\.de/event/664/contributions/2769/attachments/",  # returns 500 to automated requests
    "^https://join\\.slack\\.com/",  # blocks automated requests
    "^https://journals\\.aps\\.org/",  # blocks automated requests
]
extensions = ["css", "md", "qmd"]

[tool.pixi.dependencies]
julia = { version = "*", channel = "https://repo.prefix.dev/julia-forge" }
python = "3.13.*"
lychee = ">=0.24.0"

[tool.pixi.environments]
default = { features = ["dev", "lite"], solve-group = "main" }
doc = { features = ["doc", "lite"], solve-group = "main" }
lite = { features = ["lite"], solve-group = "main" }
main = { features = [], solve-group = "main" }

[tool.pixi.pypi-dependencies]
k-matrix-day-2025 = { path = ".", editable = true }

[tool.pixi.tasks.clean-lite]
cmd = "rm -rf docs/_build/html/lite"
description = "Remove the build files of the Jupyter Lite server"

[tool.pixi.tasks.doc]
cmd = "quarto render docs"
depends-on = [{ task = "lite", environment = "lite" }]
description = "Build website (no cell output)"

[tool.pixi.tasks.doclive]
cmd = "quarto preview docs"
depends-on = [{ task = "lite", environment = "lite" }]
description = "Preview website (live reload)"

[tool.pixi.tasks.docnb]
cmd = "pixi run doc"
depends-on = [
    "pluto-server",
    { task = "lite", environment = "lite" },
]
description = "Execute notebooks and build website"

[tool.pixi.tasks.instantiate-julia]
cmd = "julia --eval='using Pkg; Pkg.instantiate()' --project=docs"
description = "Instantiate Julia environment"

[tool.pixi.tasks.lab]
cmd = "jupyter lab docs"
description = "Launch Jupyter Lab"

[tool.pixi.tasks.lite]
cmd = "jupyter lite build --contents finding-poles.ipynb --contents finding-poles-2channels.ipynb --output-dir lite"
cwd = "docs"
depends-on = ["clean-lite"]
description = "Build Jupyter Lite server"

[tool.pixi.tasks.pluto]
cmd = "julia --eval='using Pluto; Pluto.run(notebook=\"k-matrix.jl\")' --project=."
cwd = "docs"
depends-on = ["instantiate-julia"]
description = "Launch Pluto notebook server"

[tool.pixi.tasks.pluto-server]
cmd = "julia --eval='using PlutoSliderServer; PlutoSliderServer.export_notebook(\"k-matrix.jl\")' --project=."
cwd = "docs"
depends-on = ["instantiate-julia"]
description = "Preview static Pluto website"

[tool.pixi.tasks.style]
cmd = "prek run --all-files"

[tool.pixi.tasks.upgrade]
depends-on = [
    "_upgrade-pixi",
    "_upgrade-precommit",
    "_upgrade-julia",
]
description = "Upgrade all lock files"

[tool.pixi.tasks._upgrade-pixi]
cmd = "pixi update"

[tool.pixi.tasks._upgrade-precommit]
cmd = "prek autoupdate"

[tool.pixi.tasks._upgrade-julia]
cmd = "julia --eval='using Pkg; Pkg.update()' --project=docs"

[tool.pixi.tasks.linkcheck]
cmd = "lychee ."

[tool.pixi.workspace]
authors = [
    "Ilya Segal",
    "Lena Pöpping",
    "Mikhail Mikhasenko",
    "Nils Hüsken",
    "Remco de Boer",
]
channels = ["conda-forge", "https://repo.prefix.dev/julia-forge"]
name = "kmatrix-day-2025"
platforms = [
    "linux-64",
    "osx-64",
    "osx-arm64",
    "win-64",
]
version = "0.1.0"

[tool.ruff]
extend-include = ["*.ipynb"]
preview = true
show-fixes = true

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.ruff.lint]
ignore = [
    "ANN00",
    "ANN20",
    "D",
    "PTH",
    "ambiguous-variable-name",
    "any-type",
    "if-else-block-instead-of-if-exp",
    "incorrect-blank-line-before-class",
    "line-too-long",
    "logging-f-string",
    "missing-copyright-notice",
    "missing-dashed-underline-after-section",
    "missing-section-name-colon",
    "missing-trailing-comma",
    "multi-line-summary-second-line",
    "non-empty-init-module",
    "pytest-fixture-incorrect-parentheses-style",
    "read-whole-file",
    "reimplemented-starmap",
    "single-line-implicit-string-concatenation",
    "undocumented-magic-method",
    "undocumented-public-class",
    "undocumented-public-function",
    "undocumented-public-init",
    "undocumented-public-method",
    "unspecified-encoding",
    "write-whole-file",
]
select = ["ALL"]
task-tags = ["cspell"]

[tool.ruff.lint.flake8-builtins]
ignorelist = ["display"]

[tool.ruff.lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = true

[tool.ruff.lint.flake8-self]
ignore-names = ["_print"]

[tool.ruff.lint.isort]
known-third-party = ["sympy"]
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = [
    "ANN",
    "C90",
    "PLR09",
    "T20",
    "TC00",
    "assert",
    "global-statement",
    "global-variable-not-assigned",
    "magic-value-comparison",
    "mixed-case-variable-in-global-scope",
    "module-import-not-at-top-of-file",
    "non-lowercase-variable-in-function",
    "too-many-blank-lines",
    "unnecessary-collection-call",
    "useless-expression",
    "useless-semicolon",
]
"docs/*" = [
    "assert",
    "implicit-namespace-package",
    "request-without-timeout",
]
"finding-poles-live.ipynb" = ["unused-import"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.tombi.files]
exclude = [
    "**/Manifest.toml",
    "**/Project.toml",
]

[tool.tombi.format.rules]
indent-width = 4
line-width = 88

[tool.tombi.lint.rules]
key-empty = "off"

[[tool.tombi.schemas]]
root = "tool.compwa.policy"
path = "https://raw.githubusercontent.com/ComPWA/policy/0.10.0/compwa-policy.schema.json"
include = ["pyproject.toml"]
